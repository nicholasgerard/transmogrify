name: Site

# Scoped to `site/` so the lifecycle tools keep their own independent CI.
# The root workflow (ci.yml) is unaffected by anything in this file.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      # The site renders the support matrix and compatibility pins from these
      # at build time, so a change to them can break the build.
      - 'README.md'
      - 'SKILL.md'
      - 'package.json'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'README.md'
      - 'SKILL.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  verify:
    name: check, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Astro 7 requires Node >=22.12; the test runner strips TypeScript
        # natively from 22.18 onward.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` fails if package.json and the lockfile disagree, which is the
      # reproducibility guarantee we want from CI.
      - name: Install from lockfile
        run: npm ci

      - name: Astro and TypeScript check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Analytics-enabled build audit
        if: matrix.node == 24
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TEST123XYZ
          TRANSMOGRIFY_RELEASE_COMMIT: 1111111111111111111111111111111111111111
        run: |
          npm run build
          npm run verify:base
          npm run verify:analytics

      - name: Production build
        run: npm run build

      - name: Default build audits
        run: npm run verify

      # Guards the load-bearing privacy promise: with no measurement ID the
      # output must contain no analytics code at all. `verify:html` asserts this,
      # and the grep is a second, framework-independent pair of eyes.
      - name: Assert no analytics without a measurement ID
        run: |
          if grep -rlE 'googletagmanager\.com|google-analytics\.com' dist --include='*.js' --include='*.css'; then
            echo "::error::analytics code present in a build with no PUBLIC_GA_MEASUREMENT_ID"
            exit 1
          fi
          echo "no analytics code in dist/"

      - name: Confirm no source maps shipped
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::source maps found in dist/"
            exit 1
          fi
          echo "no source maps in dist/"

      - name: Upload build output
        if: matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
          if-no-files-found: error
